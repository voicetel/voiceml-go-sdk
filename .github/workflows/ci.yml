name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint (gofmt, vet, staticcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum Go version declared in go.mod.
          - toolchain: go.mod floor
            go-version-file: go.mod
          - toolchain: stable
            go-version: stable
    env:
      # Test with exactly the installed toolchain; never auto-switch.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}
      - run: go version
      - run: go vet ./...
      - name: go test -race
        run: go test -race ./...

  version:
    name: tag matches Version
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare the tag with version.go
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' version.go)"
          if [ "$want" != "$got" ]; then
            echo "tag $GITHUB_REF_NAME does not match Version \"$got\" in version.go"
            exit 1
          fi
